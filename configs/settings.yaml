# PipeSched 本地设置。Kitsu 账号是官方 cgwire/cgwire 镜像的文档默认值，
# 不是真实工作室凭据。换自己的实例时请改这里或用环境变量覆盖。
kitsu:
  host: http://127.0.0.1:8878/api
  email: admin@example.com
  password: mysecretpassword

# 评测与规则扫描的「今天」。写死以便复现，不要用机器墙钟冒充同一轮结果。
as_of: "2026-11-13"

estimate:
  min_similar: 3
  # 排期建议默认用 P75 留缓冲；MAPE 主指标用中位数，两套都报告。
  schedule_stat: p75

llm:
  # auto: 若 .env.local 里有 SILICONFLOW_API_KEY（只读这一行，见 pipesched/envload.py），
  # 则走硅基流动官方 OpenAI 兼容接口。不要使用 DEEPSEEK_*（第三方中转）。
  # 密钥不得写入本文件、日志或评测结果。规则层与关键词基线不依赖此项。
  backend: auto
  base_url: "https://api.siliconflow.cn/v1"
  model: "deepseek-ai/DeepSeek-V3.2"
  # 不要在这里填 api_key。
  timeout_seconds: 45
  max_tokens: 256
  concurrency: 6
  max_comment_chars: 400

app:
  host: 127.0.0.1
  port: 8879

templates:
  p_mobile: configs/templates/p_mobile.yaml
  p_character: configs/templates/p_character.yaml
